services:
  - type: web
    name: mp3downloader-server
    runtime: docker
    repo: https://github.com/listamigo/mp3-descargas
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 8899
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_DIR
        value: /tmp/logs
      - key: COOKIES_FILE
        value: /tmp/cookies/cookies.txt
      - key: YTDLP_VERSION
        value: 2026.6.9
      # CRÍTICO: YouTube bloquea IPs de datacenter (Render, Railway, etc.)
      # Sin proxy residencial, las descargas fallarán intermitentemente.
      # Opciones:
      #   1. Proxy residencial (mejor): RESIDENTIAL_PROXY=socks5://user:pass@host:port
      #   2. PO token (gratis pero complejo): YT_PO_TOKEN=web+XXXX
      #   3. Cookies válidas: COOKIES_B64=<base64-de-cookies.txt>
      # - key: RESIDENTIAL_PROXY
      #   value: ""
      # - key: YT_PO_TOKEN
      #   value: ""
      # - key: COOKIES_B64
      #   value: ""
    healthCheckPath: /api/health
    # Prevenir spin-down con health checks más frecuentes
    healthCheckPolicy:
      responseTimeoutSeconds: 30
      failureThreshold: 5
      successThreshold: 1
    # Configuración de build
    buildFilter:
      ignoredPaths:
        - '**/*.md'
        - '**/*.png'
        - '**/*.deb'
        - 'desktop/**'
        - 'composeApp/**'
        - 'deb-package/**'
        - 'research/**'
